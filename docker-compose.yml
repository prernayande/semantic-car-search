# Local Postgres + pgvector for development. Credentials come from .env (see .env.example).
#   docker compose up -d db      start (data is kept in the carsearch-pgdata volume)
#   docker compose down          stop  (add -v to also delete the data)
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: cars
      POSTGRES_USER: ${DATABASE_USER:-cars}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
    ports:
      - "5433:5432"     # 5433 so it does not clash with a Postgres already installed on 5432
    volumes:
      - carsearch-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d cars"]
      interval: 2s
      retries: 15

volumes:
  carsearch-pgdata:
