# Pings the app every 10 minutes so Render's free tier does not spin it down (it sleeps after 15 min
# idle). /api/health does not touch the database, so Neon can still suspend between real searches.
name: keep-alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then echo "::notice::APP_URL repository variable not set yet; skipping"; exit 0; fi
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 "$APP_URL/api/health"
